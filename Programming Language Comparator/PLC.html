<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programming Language Comparator</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: #e2e8f0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    .app-wrapper {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      overflow: auto;
    }

    .header {
      background: linear-gradient(90deg, #1e293b 0%, #334155 100%);
      padding: 40px 30px;
      text-align: center;
      border-bottom: 2px solid #475569;
    }

    .header h1 {
      margin: 0;
      font-size: 2.5em;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .header p {
      margin: 8px 0 0 0;
      color: #cbd5e1;
      font-size: 1em;
      font-weight: 300;
    }

    .content {
      flex: 1;
      padding: 40px 30px;
      overflow-y: auto;
    }

    .selector-section {
      margin-bottom: 30px;
    }

    .selector-label {
      font-size: 1.1em;
      font-weight: 600;
      color: #60a5fa;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .language-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .lang-btn {
      padding: 10px 20px;
      background: #334155;
      border: 2px solid #475569;
      border-radius: 8px;
      color: #cbd5e1;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 0.95em;
    }

    .lang-btn:hover {
      background: #475569;
      border-color: #60a5fa;
      transform: translateY(-2px);
    }

    .lang-btn.selected {
      background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 100%);
      border-color: #60a5fa;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(96, 165, 250, 0.3);
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 30px;
    }

    .comparison-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 25px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .comparison-card:hover {
      border-color: #475569;
      background: #1e293b;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      font-size: 1.2em;
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .lang-comparison {
      display: grid;
      gap: 12px;
    }

    .lang-item {
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #60a5fa;
      animation: slideIn 0.4s ease forwards;
    }

    .lang-item:nth-child(2) {
      animation-delay: 0.1s;
    }

    .lang-item:nth-child(3) {
      animation-delay: 0.2s;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .lang-name {
      font-weight: 700;
      color: #60a5fa;
      margin-bottom: 5px;
      font-size: 1em;
    }

    .lang-content {
      color: #cbd5e1;
      font-size: 0.95em;
      line-height: 1.6;
    }

    .code-block {
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      overflow-x: auto;
      color: #a78bfa;
      margin-top: 8px;
      border: 1px solid #334155;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
    }

    .empty-state p {
      font-size: 1.1em;
      margin: 10px 0;
    }

    @media (max-width: 1200px) {
      .header h1 {
        font-size: 2em;
      }
      .content {
        padding: 30px 20px;
      }
    }

    @media (max-width: 768px) {
      .header {
        padding: 30px 20px;
      }
      .header h1 {
        font-size: 1.6em;
      }
      .content {
        padding: 20px 15px;
      }
      .lang-btn {
        padding: 8px 16px;
        font-size: 0.9em;
      }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="app-wrapper">
   <div class="header">
    <h1 id="app-title">Programming Language Comparator</h1>
    <p id="app-subtitle">Compare languages side-by-side</p>
   </div>
   <div class="content">
    <div class="selector-section">
     <div class="selector-label">
      Select Languages to Compare
     </div>
     <div class="language-buttons" id="languageButtons"></div>
    </div>
    <div id="comparisonContainer"></div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      app_title: "Programming Language Comparator",
      app_subtitle: "Compare languages side-by-side"
    };

    let config = { ...defaultConfig };

    const languages = {
      python: {
        name: "Python",
        type: "Interpreted",
        performance: "Slow",
        learning_curve: "Easy",
        use_cases: "Data Science, AI/ML, Automation, Web Backend",
        syntax: "print('Hello, World!')",
        ecosystem: "Excellent (NumPy, Pandas, Django)",
        community: "Very Large",
        hiring_demand: "Very High"
      },
      javascript: {
        name: "JavaScript",
        type: "Interpreted",
        performance: "Medium",
        learning_curve: "Easy",
        use_cases: "Web Frontend, Backend (Node.js), Full-Stack",
        syntax: "console.log('Hello, World!');",
        ecosystem: "Excellent (React, Vue, Express)",
        community: "Very Large",
        hiring_demand: "Very High"
      },
      java: {
        name: "Java",
        type: "Compiled",
        performance: "Fast",
        learning_curve: "Medium",
        use_cases: "Enterprise Apps, Android, Large Systems",
        syntax: "System.out.println('Hello, World!');",
        ecosystem: "Excellent (Spring, Hibernate)",
        community: "Very Large",
        hiring_demand: "High"
      },
      cpp: {
        name: "C++",
        type: "Compiled",
        performance: "Very Fast",
        learning_curve: "Hard",
        use_cases: "Systems, Games, High-Performance Computing",
        syntax: "std::cout << 'Hello, World!' << std::endl;",
        ecosystem: "Good",
        community: "Large",
        hiring_demand: "Medium"
      },
      go: {
        name: "Go",
        type: "Compiled",
        performance: "Very Fast",
        learning_curve: "Medium",
        use_cases: "Backend, Cloud/DevOps, Microservices",
        syntax: "fmt.Println('Hello, World!')",
        ecosystem: "Good",
        community: "Growing",
        hiring_demand: "Medium-High"
      },
      rust: {
        name: "Rust",
        type: "Compiled",
        performance: "Very Fast",
        learning_curve: "Hard",
        use_cases: "Systems, WebAssembly, Performance-Critical",
        syntax: "println!('Hello, World!');",
        ecosystem: "Growing",
        community: "Growing",
        hiring_demand: "Medium"
      }
    };

    const comparisonCategories = [
      { key: "type", label: "Type" },
      { key: "performance", label: "Performance" },
      { key: "learning_curve", label: "Learning Curve" },
      { key: "use_cases", label: "Use Cases" },
      { key: "syntax", label: "Hello World Syntax" },
      { key: "ecosystem", label: "Ecosystem" },
      { key: "community", label: "Community Size" },
      { key: "hiring_demand", label: "Hiring Demand" }
    ];

    let selectedLanguages = new Set();

    function initializeApp() {
      renderLanguageButtons();
      renderComparison();
    }

    function renderLanguageButtons() {
      const container = document.getElementById("languageButtons");
      container.innerHTML = "";

      Object.entries(languages).forEach(([key, lang]) => {
        const btn = document.createElement("button");
        btn.className = `lang-btn ${selectedLanguages.has(key) ? "selected" : ""}`;
        btn.textContent = lang.name;
        btn.onclick = () => toggleLanguage(key);
        container.appendChild(btn);
      });
    }

    function toggleLanguage(langKey) {
      if (selectedLanguages.has(langKey)) {
        selectedLanguages.delete(langKey);
      } else {
        if (selectedLanguages.size < 3) {
          selectedLanguages.add(langKey);
        }
      }
      renderLanguageButtons();
      renderComparison();
    }

    function renderComparison() {
      const container = document.getElementById("comparisonContainer");
      container.innerHTML = "";

      if (selectedLanguages.size === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <p>👈 Select 1-3 languages to compare</p>
            <p style="font-size: 0.9em; color: #475569;">Click on language buttons above to get started</p>
          </div>
        `;
        return;
      }

      comparisonCategories.forEach((category) => {
        const card = document.createElement("div");
        card.className = "comparison-card";

        let html = `<div class="card-title">${category.label}</div><div class="lang-comparison">`;

        selectedLanguages.forEach((langKey) => {
          const lang = languages[langKey];
          const value = lang[category.key];
          const isCode = category.key === "syntax";

          html += `
            <div class="lang-item">
              <div class="lang-name">${lang.name}</div>
              <div class="lang-content">
                ${isCode ? `<div class="code-block">${value}</div>` : value}
              </div>
            </div>
          `;
        });

        html += `</div>`;
        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    async function onConfigChange(newConfig) {
      document.getElementById("app-title").textContent = newConfig.app_title || defaultConfig.app_title;
      document.getElementById("app-subtitle").textContent = newConfig.app_subtitle || defaultConfig.app_subtitle;
    }

    function mapToCapabilities(currentConfig) {
      return {
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      };
    }

    function mapToEditPanelValues(currentConfig) {
      return new Map([
        ["app_title", currentConfig.app_title || defaultConfig.app_title],
        ["app_subtitle", currentConfig.app_subtitle || defaultConfig.app_subtitle]
      ]);
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities,
        mapToEditPanelValues
      });
      config = window.elementSdk.config;
    }

    initializeApp();
  </script>

</html>
